  },
  en: {
    tagline: "Custom PC builds · Case modding",
    about_title: "About",
    about_text: `Veilforge builds custom PCs and does custom case modding in Ivano-Frankivsk. Over 5 years of professional experience in building, testing and diagnosing computers.`,
    services_title: "Services",
    service1: "• <b>Custom PC Builds</b><br>New-component PCs for gaming, work and creative tasks.",
    service2: "• <b>Component Selection</b><br>A balanced configuration for your budget, no brand-name markup.",
    service3: "• <b>Case Modding & Customization</b><br>Unique PCs: custom parts, liquid cooling, lighting, 3D modeling.",
    service4: "• <b>Testing & Diagnostics</b><br>Stability, temperature and performance checks.",
    contacts_title: "Contacts",
    phone_label: "Phone:",
    area: "Ivano-Frankivsk. Order format and PC handover are agreed individually.",

    ov_4: "Custom PC: Little Nightmares diorama",
    ov_5: "Tower air cooler build",

    music: "Music"
  }
};

const audio = document.getElementById('soundtrack');
const musicBtn = document.getElementById('musicBtn');
audio.volume = 0.5;

function syncMusicBtn() { musicBtn.classList.toggle('playing', !audio.paused); }
audio.addEventListener('play', syncMusicBtn);
audio.addEventListener('pause', syncMusicBtn);

// Browsers block sound until the visitor interacts, so start on the first real click/tap/key
const starters = ['click', 'touchend', 'keydown'];
function firstInteraction(e) {
  if (musicBtn.contains(e.target)) return;
  audio.play().then(() => starters.forEach(ev => document.removeEventListener(ev, firstInteraction)))
              .catch(() => {});
}
starters.forEach(ev => document.addEventListener(ev, firstInteraction));

musicBtn.addEventListener('click', () => {
  starters.forEach(ev => document.removeEventListener(ev, firstInteraction));
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});

// Pause when the tab is hidden, resume if it was playing
let wasPlaying = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { wasPlaying = !audio.paused; audio.pause(); }
  else if (wasPlaying) audio.play().catch(() => {});
});

function setLanguage(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = translations[lang][el.dataset.i18n];
  });
  musicBtn.setAttribute('aria-label', translations[lang].music);
  musicBtn.title = translations[lang].music;
}

document.querySelector(".lang .gb").onclick = e => { e.preventDefault(); setLanguage("en"); };
document.querySelector(".lang .ua").onclick = e => { e.preventDefault(); setLanguage("uk"); };
setLanguage("uk");
</script>
